name: Deploy Web App to GitHub Pages (gh-pages)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate and test web application
        run: |
          for f in web/*.js; do node --check "$f"; done
          node --test web/analytics.test.mjs

      - name: Build static web bundle
        run: |
          mkdir -p dist
          cp web/index.html web/styles.css web/app.js web/analytics.js web/charts.js web/firebase.js web/config.js dist/
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
